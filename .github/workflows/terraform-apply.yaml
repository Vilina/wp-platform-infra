name: Terraform Apply

# Deployment after merge to main:
#   1. dev:  plan + apply automatically
#   2. prod: plan with the read-only role, shown in the run summary
#   3. prod: wait for approval (required reviewers on the "prod" GitHub environment),
#            then apply exactly the reviewed plan file
#
# Apply jobs declare `environment:` because the apply roles only trust the
# OIDC subject <repo>:environment:<env>.

on:
  push:
    branches: [main]
    paths-ignore:
      - "bootstrap/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

# One deployment at a time. Never cancel a running apply; newer runs wait.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # dev: plan and apply in one job, no approval
  # ---------------------------------------------------------------------------
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: apply-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -no-color -backend-config="config/${ENVIRONMENT}.backend"

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -var-file="config/${ENVIRONMENT}.tfvars" \
            -out=tfplan

          terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        if: always()
        run: .github/scripts/plan-summary.sh "$ENVIRONMENT" plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

  # ---------------------------------------------------------------------------
  # prod plan: read-only role, no environment (no approval needed to look)
  # ---------------------------------------------------------------------------
  plan-prod:
    name: Plan (prod)
    needs: apply-dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: prod

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PROD_PLAN_ROLE_ARN }}
          role-session-name: plan-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -no-color -backend-config="config/${ENVIRONMENT}.backend"

      - name: Terraform plan
        id: plan
        run: |
          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -var-file="config/${ENVIRONMENT}.tfvars" \
            -out=tfplan
          code=$?
          set -e

          if [[ $code -eq 1 ]]; then exit 1; fi
          echo "has_changes=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        if: always()
        run: .github/scripts/plan-summary.sh "$ENVIRONMENT" plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: tfplan
          retention-days: 7

  # ---------------------------------------------------------------------------
  # prod apply: waits for approval, then applies the reviewed plan file
  # ---------------------------------------------------------------------------
  apply-prod:
    name: Apply (prod)
    needs: plan-prod
    if: needs.plan-prod.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: apply-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod

      - name: Terraform init
        run: terraform init -input=false -no-color -backend-config="config/${ENVIRONMENT}.backend"

      # A saved plan is refused if the state changed since it was made,
      # so nothing unreviewed can be applied.
      - name: Terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
